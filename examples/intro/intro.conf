# Example login intro for a BashBBS installation. Copy this directory to
# $BBS_ROOT/etc/intro/ (root-owned, plain files, at most 16 KB each).
#
#   <seconds> <file> [<narrow-file> [<caption-file> [<narrow-caption-file>]]]   (- = none)
#
# <file> is shown unchanged when the terminal is at least as wide as its widest line,
# otherwise <narrow-file>; a screen with no fitting file is skipped. Space skips a
# screen; a caption wider than the terminal falls back to <narrow-caption-file> or is left out. Remove this file (or the directory) for no intro at all.
#
#   season <MMDD>-<MMDD> <file>
#
# puts <file> above the first screen while today is in the window (both days included,
# 1220-0106 runs over New Year), e.g. "season 1031-1105 halloween.txt".
5 welcome.txt
