[Service]
# Port 80 only from the proxy, if /etc/bashbbs-web.nft exists (etc/web-proxy.example.nft).
# A broken file stops lighttpd instead of leaving it open.
ExecStartPre=+/bin/sh -c 'test ! -e /etc/bashbbs-web.nft || /usr/sbin/nft -f /etc/bashbbs-web.nft'
ExecStart=
ExecStart=/usr/sbin/lighttpd -D -f /etc/lighttpd/bashbbs.conf
