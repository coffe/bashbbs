
# BashBBS: block appended at the END of sshd_config (Match scope runs to EOF).
# The news account only queues posts. sshd uses the first value it finds, so this
# block must stay above the general one. install.sh does not re-add it on an existing host.
# bbs-news needs a real login shell (/bin/bash): sshd runs ForceCommand through it as
# "shell -c". bbs-shell would ignore the -c and start the menu instead.
Match User bbs-news
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY no
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-ingest
# newsstatus: the status channel for the news producer on jelly. The key also carries
# restrict,command=, but ForceCommand here holds even if the key line is changed. No
# pty, no forwarding, no X11: the account can run bbs-news-status and nothing else.
# Login shell /bin/bash (as on the old Zero) is needed because sshd runs ForceCommand
# as "shell -c". nologin or /bin/false would stop it. The login shell is never used interactively.
Match User newsstatus
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY no
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-news-status
Match User bbs-*
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY yes
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-shell
