
# BashBBS: block appended at the END of sshd_config (Match scope runs to EOF).
# The news account only queues posts. sshd uses the first value it finds, so this
# block must stay above the general one. install.sh does not re-add it on an existing host.
# bbs-news needs a real login shell (/bin/bash): sshd runs ForceCommand through it as
# "shell -c". bbs-shell would ignore the -c and start the menu instead.
Match User bbs-news
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY no
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-ingest
Match User bbs-*
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY yes
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-shell
