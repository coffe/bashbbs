
# BashBBS: block appended at the END of sshd_config (Match scope runs to EOF).
Match User bbs-*
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/%u
    PermitTTY yes
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-shell
