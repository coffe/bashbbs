# lighttpd for the BashBBS front page and application form.
# Serves static files and runs apply.cgi and x.cgi. Nothing else is exposed.
server.document-root = "/var/www/bbs"
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.modules       = ( "mod_access", "mod_dirlisting", "mod_cgi", "mod_redirect" )
server.max-request-size = 8
server.errorlog      = "/var/log/lighttpd/error.log"
index-file.names     = ( "index.html" )
cgi.assign           = ( ".cgi" => "" )
url.redirect         = ( "^/devlog/([a-z0-9-]+)$" => "/devlog/$1.html" )
url.access-deny      = ( "~", ".bak", ".py", ".sh" )
mimetype.assign      = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css",
  ".txt"  => "text/plain; charset=utf-8",
  ".xml"  => "application/atom+xml; charset=utf-8"
)

# File transfers (x.cgi): sysops have no size limit, so lighttpd allows 32 GB (in kB) and
# x.cgi refuses anyone else's file over UPLOAD_MAX_BYTES from Content-Length, before the
# body is read. The 8 kB above still protects apply.cgi. Streaming keeps lighttpd from writing each
# upload to the SD card twice, and lets x.cgi know when a download has really gone out.
$HTTP["url"] =~ "^/x\.cgi/" {
    server.max-request-size = 33554432
    server.stream-request-body = 2
    server.stream-response-body = 2
}
