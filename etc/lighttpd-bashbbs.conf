# lighttpd for the BashBBS front page and application form.
# Serves static files and runs apply.cgi. Nothing else is exposed.
server.document-root = "/var/www/bbs"
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.modules       = ( "mod_cgi" )
server.max-request-size = 8
server.dir-listing   = "disable"
server.errorlog      = "/var/log/lighttpd/error.log"
index-file.names     = ( "index.html" )
cgi.assign           = ( ".cgi" => "" )
url.access-deny      = ( "~", ".bak", ".py", ".sh" )
mimetype.assign      = (
  ".html" => "text/html; charset=utf-8",
  ".css"  => "text/css",
  ".txt"  => "text/plain; charset=utf-8"
)
