# Example global sshd settings for a BashBBS host. Not installed by install.sh.
# Copy to /etc/ssh/sshd_config.d/10-hardening.conf and replace <ADMIN_USER> and
# <STATUS_USER> (delete the status line if you have no status account). Keep a
# second admin session open, then check with: sshd -t
# These settings are global. The Match block that install.sh appends at the end
# of sshd_config overrides some of them for the bbs-* accounts.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers <ADMIN_USER> bbs-* <STATUS_USER>
