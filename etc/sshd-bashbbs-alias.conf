# BashBBS short names: block appended at the END of sshd_config, after "Match User bbs-*".
# `ptrko` is an alias passwd entry for bbs-ptrko (same uid, home and shell; see sbin/bbs-alias).
# All aliases are members of the group bbsalias. Same settings as the bbs-* block, but the
# key file is still the one of the real account: keys/bbs-<alias>.
# Needs "AllowGroups <admin> newsstatus bbs-* bbsalias" in the global hardening file
# (see etc/sshd-hardening.example.conf), and no AllowUsers line (AllowUsers + AllowGroups = AND).
Match Group bbsalias
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /srv/bashbbs/keys/bbs-%u
    PermitTTY yes
    PermitTunnel no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitUserRC no
    ForceCommand /usr/local/sbin/bbs-shell
